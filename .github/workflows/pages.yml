# main に push されたとき、毎日の定時(新着の取り込み → ビルド)、手動実行のときに、サイトをビルドして GitHub Pages に公開する
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 21 * * *" # 毎日 日本時間 6:17
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04 # ubuntu-latest が Ubuntu 26 に切り替わる時期は、実行待ちが長引くことがあったので、安定版に固定している
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 大きい画像を縮小するために Pillow を使う
      - run: pip install pillow
      # 定時・手動実行のときだけ、Apple Music / YouTube の新着の取り込みと Spotify のリンク付け、BOOTH の商品一覧の更新をして、works/ と booth-items.json にコミットする
      # (booth-items.json もコミットしておかないと、ふだんの push でのビルドで、新しい BOOTH の商品が消えてしまう)
      - name: Import new releases
        if: github.event_name != 'push'
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          python import_works.py
          if [ -n "$(git status --porcelain works booth-items.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add works booth-items.json
            git commit -m "Import new releases"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
