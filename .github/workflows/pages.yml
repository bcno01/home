# main に push されたとき、毎日の定時(新着の取り込み → ビルド)、手動実行のときに、サイトをビルドして GitHub Pages に公開する
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 21 * * *" # 毎日 日本時間 6:17
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # 新作を取り込んだときの通知(Issue)に使う
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04 # ubuntu-latest が Ubuntu 26 に切り替わる時期は、実行待ちが長引くことがあったので、安定版に固定している
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 大きい画像を縮小するために Pillow を使う
      - run: pip install pillow
      # 定時・手動実行のときだけ、Apple Music / YouTube の新着の取り込みと Spotify のリンク付け、BOOTH の商品一覧の更新をして、works/ と 設定/booth-items.json にコミットする
      # (設定/booth-items.json もコミットしておかないと、ふだんの push でのビルドで、新しい BOOTH の商品が消えてしまう)
      - name: Import new releases
        if: github.event_name != 'push'
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}   # 任意。あれば、Discord にも通知する
        run: |
          export IMPORT_SUMMARY="$RUNNER_TEMP/import-summary.md"
          python scripts/import_works.py
          if [ -n "$(git status --porcelain works 設定/booth-items.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add works 設定/booth-items.json
            git commit -m "Import new releases"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          # 新しい作品などがあれば、通知する(GitHub の Issue = メールで届く。Discord は任意)。通知に失敗しても、公開は止めない
          if [ -s "$IMPORT_SUMMARY" ]; then
            # 担当(assignee)にオーナーを指定しておくと、ウォッチの設定をしていなくても、メールの通知が届く
            title="新着を取り込みました ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
            gh issue create --title "$title" --body-file "$IMPORT_SUMMARY" --assignee "$GITHUB_REPOSITORY_OWNER" \
              || gh issue create --title "$title" --body-file "$IMPORT_SUMMARY" \
              || echo "Issue の作成に失敗しました"
            python scripts/notify.py "$IMPORT_SUMMARY" || true
          fi
      - run: python scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
